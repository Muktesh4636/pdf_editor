# Full vhost template for pdfforge.store — copy into /etc/nginx/sites-available/ and symlink to sites-enabled.
#   sudo nginx -t && sudo systemctl reload nginx
#
# --- If you see "Bad Request (400)" with an empty <p> on https://pdfforge.store/ ---
# Your A record points at the same VPS as another app (e.g. Django on pimux.store).
# TLS SNI "pdfforge.store" is falling through to that app, which rejects the Host → HTTP 400.
# Fix: add THIS server block (server_name pdfforge.store) + a real certificate for pdfforge.store
# (certbot -d pdfforge.store). Do NOT rely on pimux.store's cert — browsers will warn and
# nginx may still route to the wrong default_server until SNI matches this block.
#
# EDIT: ssl_certificate paths after certbot (or your CA).
# EDIT: root if your files live elsewhere (must match deploy.sh REMOTE).
#
# Other 400 causes this template also avoids:
#   - Plain HTTP hitting port 443 (separate listen 80 block + redirect).
#   - proxy_pass with a trailing slash strips /api and breaks routes (do NOT use trailing slash here).

upstream pdf_archive_upstream {
    server 127.0.0.1:3847;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pdfforge.store www.pdfforge.store;

    root /var/www/pdfforge.store;
    index index.html;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://pdfforge.store$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdfforge.store www.pdfforge.store;

    ssl_certificate     /etc/letsencrypt/live/pdfforge.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfforge.store/privkey.pem;

    ssl_early_data off;

    root /var/www/pdfforge.store;
    index index.html;

    large_client_header_buffers 4 32k;

    if ($host = www.pdfforge.store) {
        return 301 https://pdfforge.store$request_uri;
    }

    # API — no trailing slash on proxy_pass URL (keeps /api/... on the backend)
    location /api/ {
        proxy_pass http://pdf_archive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 80m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
